# Nginx 反代配置：对外 80/443，对内转给 127.0.0.1:8000
#
# 用法（Ubuntu）：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai-trip
#   sudo ln -s /etc/nginx/sites-available/ai-trip /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 三处必须自己改：server_name、证书路径。改完先 nginx -t 再 reload。

# ---------- 80：只做跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name 你的域名.com www.你的域名.com;

    # 证书申请（certbot / 阿里云）走这个目录，别让跳转吃掉
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：真正的服务 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 你的域名.com www.你的域名.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 行程 JSON 不大，但导出接口可能传整份计划；给 8M 足够
    client_max_body_size 8m;

    # 访问日志按天切，出问题能回溯
    access_log /var/log/nginx/ai-trip.access.log;
    error_log  /var/log/nginx/ai-trip.error.log;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 这几个头必须带，否则后端拿到的都是 127.0.0.1
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型一次解说可能要几十秒：默认 60s 会掐断，这里放到 120s
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 健康检查不给外网看细节，只回一个 200（监控/探活用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
