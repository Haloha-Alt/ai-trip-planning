<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 出行与规划</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --ink:#1f2328;
    --sub:#6b7280; --accent:#2563eb; --accent-soft:#eaf1ff;
    --warn:#b45309; --warn-bg:#fff7ed; --ok:#15803d; --ok-bg:#f0fdf4;
    --stay:#2563eb; --move:#9aa4b2; --wait:#f59e0b; --best:#15803d; --best-bg:#f0fdf4;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:18px 24px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:19px}
  header p{margin:4px 0 0;color:var(--sub);font-size:13px}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px 40px}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{margin:0 0 12px;font-size:15px}
  label{display:block;margin:10px 0 4px;color:var(--sub);font-size:12px}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
       border-radius:7px;background:#fff;color:var(--ink);font-size:13px}
  textarea{resize:vertical;min-height:76px}
  button{width:100%;padding:10px;margin-top:14px;border:0;border-radius:7px;
       background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.06)}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.55;cursor:progress}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
  @media (max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}}
  .metric{background:var(--accent-soft);border-radius:8px;padding:10px;text-align:center}
  .metric b{display:block;font-size:17px}
  .metric span{font-size:11px;color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--sub);font-weight:600;font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .day{margin-bottom:18px}
  .warn{background:var(--warn-bg);border:1px solid #fed7aa;color:var(--warn);
        border-radius:8px;padding:10px;margin-top:12px;font-size:13px}
  .ok{background:var(--ok-bg);border:1px solid #bbf7d0;color:var(--ok);
      border-radius:8px;padding:10px;margin-top:12px;font-size:13px}
  .muted{color:var(--sub);font-size:12px}
  .exp{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .exp button{width:auto;padding:7px 12px;margin:0;font-size:13px}
  svg{width:100%;height:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:8px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--accent-soft);
        color:var(--accent);font-size:12px;margin-right:6px}
  .narr{background:#f8fafc;border-left:3px solid var(--accent);border-radius:6px;
        padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.7}
  .tip{color:var(--sub);font-size:12px;line-height:1.5;margin-top:2px}

  /* ---- 页签 ---- */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{width:auto;margin:0;padding:8px 16px;background:#fff;color:var(--sub);
       border:1px solid var(--line);font-size:13px}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pane{min-height:80px}

  /* ---- 时间轴 ---- */
  .legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px}
  .legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px}
  .tl-day{margin-bottom:14px}
  .tl-day h3{margin:0 0 6px;font-size:13px;font-weight:600}
  .tl-day h3 span{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px}

  /* ---- 算法对比 ---- */
  .cmp-summary{background:var(--best-bg);border:1px solid #bbf7d0;color:#14532d;
       border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px}
  tr.best td{background:var(--best-bg);font-weight:600}
  tr.best td:first-child{color:var(--best)}
  .bars{margin-top:14px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 62px;gap:10px;align-items:center;
       margin-bottom:7px;font-size:12px}
  .bar-track{background:#eef1f5;border-radius:99px;height:14px;overflow:hidden}
  .bar-fill{height:14px;border-radius:99px;background:var(--accent)}
  .bar-fill.dim{background:#9aa4b2}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}

  details{margin-top:12px}
  summary{cursor:pointer;color:var(--sub);font-size:13px}
  pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto;
      font-size:12px;line-height:1.5;max-height:340px}
</style>
</head>
<body>
<header>
  <h1>AI 出行与规划</h1>
  <p>多城市 · 可换算法 · 时间轴 / 地图 / 算法对比 · 结果可导出（JSON / Markdown / CSV）</p>
</header>

<div class="wrap">
  <!-- 左：输入 -->
  <div class="card">
    <h2>出行需求</h2>
    <label>一句话需求</label>
    <textarea id="q">上午去图书馆自习，中午食堂吃饭，顺便取快递，别太赶</textarea>

    <div class="row">
      <div>
        <label>城市</label>
        <select id="city"></select>
      </div>
      <div>
        <label>场景</label>
        <select id="scenario"></select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>算法</label>
        <select id="strategy"></select>
      </div>
      <div>
        <label>节奏</label>
        <select id="pace">
          <option value="relaxed">轻松</option>
          <option value="normal" selected>正常</option>
          <option value="packed">紧凑</option>
        </select>
      </div>
    </div>

    <label>出行方式（影响在途时间估算）</label>
    <select id="mobility">
      <option value="transit">公共交通</option>
      <option value="walk" selected>步行</option>
      <option value="drive">驾车</option>
    </select>

    <div class="row">
      <div>
        <label>天数</label>
        <input id="days" type="number" min="1" max="7" value="1">
      </div>
      <div>
        <label>每天站点数</label>
        <input id="top_n" type="number" min="1" max="8" value="4">
      </div>
    </div>

    <div class="row">
      <div>
        <label>出发</label>
        <input id="start" type="time" value="07:30">
      </div>
      <div>
        <label>返回</label>
        <input id="end" type="time" value="20:00">
      </div>
    </div>

    <label>每日预算（0 = 不限制）</label>
    <input id="budget" type="number" min="0" step="10" value="0">

    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink)">
      <input type="checkbox" id="rt" checked style="width:auto">
      使用实时天气（雨天自动改室内；抓不到自动降级）
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--ink)">
      <input type="checkbox" id="narrate" checked style="width:auto">
      生成解说（没配大模型 Key 时用规则模板）
    </label>
    <p class="muted" style="margin:8px 0 0">参数默认「跟随需求文本」：只有你手动改过的那一项，才会覆盖文本解析的结果。</p>

    <button id="go">生成行程</button>
    <button class="ghost" id="cmp">算法对比（同一份需求，各算法跑一遍）</button>
    <button class="ghost" id="reload">清空数据缓存（改了 CSV 后点）</button>
    <p class="muted" style="margin-top:10px">接口状态：<span id="health">…</span></p>
  </div>

  <!-- 右：结果 -->
  <div>
    <div id="summary"></div>

    <div class="card" id="adjustBar" hidden style="margin-bottom:14px">
      <h2>一句话调整</h2>
      <div class="row" style="grid-template-columns:1fr auto;align-items:end">
        <div>
          <label>只改被点名的那一站，其余保持不动</label>
          <input id="adjText" placeholder="第2站太贵了换一个 / 删掉第3站 / 再加一站 / 太赶了">
        </div>
        <button id="adjGo" style="margin:0;width:auto;padding:9px 16px">应用调整</button>
      </div>
      <p class="muted" id="adjNote" style="margin:8px 0 0"></p>
    </div>

    <nav class="tabs" id="tabs" hidden>
      <button class="tab active" data-tab="list">行程表</button>
      <button class="tab" data-tab="timeline">时间轴</button>
      <button class="tab" data-tab="map">地图</button>
      <button class="tab" data-tab="compare">算法对比</button>
    </nav>

    <div class="pane" id="pane-list">
      <div class="card"><p class="muted">填好需求后点「生成行程」。</p></div>
    </div>
    <div class="pane" id="pane-timeline" hidden></div>
    <div class="pane" id="pane-map" hidden></div>
    <div class="pane" id="pane-compare" hidden></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let LAST = null;        // 最近的查询条件，导出与对比复用
let PLAN = null;        // 最近一次的规划结果
let PTS = [];           // 地图点
let CMP = null;         // 最近一次的算法对比结果
let OPTS = null;        // /api/options 的原始返回（切场景时要用）
let ADJ = [];           // 本份行程已经下过的调整指令，按顺序重放

/* 所有拼进 innerHTML 的外部文本都要过一遍 —— 站点名里出现 & 或 < 时页面不能崩 */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(body)} : {method:'GET'};
  const r = await fetch(path, opt);
  if (!r.ok && r.status >= 500) throw new Error('服务端 ' + r.status);
  return await r.json();
}

async function boot() {
  try {
    const h = await api('/api/health');
    $('health').textContent = h.ok
      ? ('正常 · 城市 ' + h.cities + ' 个 · 高德'
         + ((h.amap && h.amap.configured) ? ('已接入（' + h.amap.cached_points + ' 条真实路线）') : '未配置'))
      : ('异常：' + h.error);
  } catch (e) {
    $('health').textContent = '连不上后端（用 python -m api.server 启动）';
  }
  try {
    const o = await api('/api/options');
    OPTS = o;
    fill('city', o.cities, o.default_city, c => [c.key, c.name + '（' + c.key + '）']);
    fill('scenario', o.scenarios, o.default_scenario, s => [s, s]);
    fill('strategy', o.strategies, o.default_strategy, s => [s, s]);
  } catch (e) { /* 选项拉不到就用空下拉，页面不至于打不开 */ }
}

/* 换场景时把算法切回该场景的默认值 —— 但用户手动选过算法就不动。
 * 没有这一步，"切到 tight-budget 却还在跑 two_opt"会让场景配置形同虚设。 */
function bindScenarioStrategy(){
  $('scenario').addEventListener('change', () => {
    if (TOUCHED.strategy || !OPTS || !OPTS.scenario_strategies) return;
    const s = OPTS.scenario_strategies[$('scenario').value];
    if (s) $('strategy').value = s;
  });
}

function fill(id, items, def, kv) {
  const sel = $(id);
  sel.innerHTML = '';
  (items || []).forEach(it => {
    const [v, label] = kv(it);
    const op = document.createElement('option');
    op.value = v; op.textContent = label;
    if (v === def) op.selected = true;
    sel.appendChild(op);
  });
}

/* 哪些控件被用户**手动改过**。
 *
 * 不记这个就会踩一个很难发现的坑：文本写「别太赶」（解析成 relaxed，每天 2 站），
 * 而下拉框默认是 normal，无条件当覆盖传上去 → 文本被静默抹掉，每天变 4 站。
 * Streamlit 端早就有这层保护（`_touched`），网页端必须一致。
 */
const TOUCHED = {};

function markTouched(field){
  const el = $(field);
  if (!el) return;
  const set = () => { TOUCHED[field] = true; };
  el.addEventListener('input', set);
  el.addEventListener('change', set);
}

['start', 'end', 'budget', 'top_n', 'pace', 'mobility', 'days', 'city',
 'strategy'].forEach(markTouched);

function collect() {
  const ov = {};
  if (TOUCHED.city) ov.city = $('city').value;
  if (TOUCHED.days) ov.days = Number($('days').value) || 1;
  if (TOUCHED.top_n) ov.top_n = Number($('top_n').value) || 4;
  if (TOUCHED.pace) ov.pace = $('pace').value;
  if (TOUCHED.mobility) ov.mobility = $('mobility').value;
  if (TOUCHED.start) ov.start_time = $('start').value;
  if (TOUCHED.end) ov.end_time = $('end').value;
  if (TOUCHED.budget) ov.daily_budget = Number($('budget').value) || 0;

  return {
    query: $('q').value.trim(),
    scenario: $('scenario').value,
    strategy: $('strategy').value,
    realtime: $('rt').checked,
    narrate: $('narrate').checked,
    overrides: ov
  };
}

/* ---------------------------------------------------------------- 页签 */

function showTab(name){
  document.querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.pane').forEach(p =>
    p.hidden = (p.id !== 'pane-' + name));
}

document.querySelectorAll('.tab').forEach(b => {
  b.onclick = () => showTab(b.dataset.tab);
});

/* ---------------------------------------------------------------- 规划 */

async function plan() {
  const payload = collect();
  LAST = payload;
  $('go').disabled = true;
  $('summary').innerHTML = '<div class="card"><p class="muted">规划中…</p></div>';
  let res;
  try {
    res = await api('/api/plan', payload);
  } catch (e) {
    $('summary').innerHTML = '<div class="card"><div class="warn">请求失败：' + esc(e.message || e) + '</div></div>';
    $('go').disabled = false;
    return;
  }
  $('go').disabled = false;
  if (!res.ok) {
    $('summary').innerHTML = '<div class="card"><div class="warn">' + esc(res.error) + '</div></div>';
    return;
  }
  PLAN = res.plan;
  PTS = res.map || [];
  ADJ = [];                    // 新行程 = 调整历史的新起点
  renderPlan();
  showTab('list');
}

function renderPlan(){
  $('tabs').hidden = false;
  $('adjustBar').hidden = false;
  $('summary').innerHTML = '<div class="card">' + narrativeHtml(PLAN) + metricsHtml(PLAN)
                         + metaLine(PLAN) + realtimeNote(PLAN) + warningsHtml(PLAN)
                         + pendingHtml(PLAN) + exportBar() + '</div>';
  $('pane-list').innerHTML = listHtml(PLAN);
  $('pane-timeline').innerHTML = timelineHtml(PLAN);
  $('pane-map').innerHTML = mapHtml(PTS);
  if (CMP) $('pane-compare').innerHTML = compareHtml(CMP);
}

/* 解说：模型写的就标「模型」，规则拼的标「规则」—— 不假装哪句是模型说的 */
function narrativeHtml(plan){
  const n = (plan.meta && plan.meta.narrative) || null;
  if (!n || !n.summary) return '';
  return '<div class="narr"><b>一句话概括</b><br>' + esc(n.summary) + '</div>';
}

function metricsHtml(plan){
  const m = plan.metrics;
  return '<div class="metrics">'
    + metric('满意度', m.satisfaction) + metric('预算友好', m.cost)
    + metric('时间利用', m.time) + metric('路程紧凑', m.distance)
    + metric('可行性', m.feasibility) + metric('总分', m.overall)
    + '</div>';
}

function metric(label, v) {
  const n = (typeof v === 'number') ? v.toFixed(4) : esc(v);
  return '<div class="metric"><b>' + n + '</b><span>' + label + '</span></div>';
}

function metaLine(plan){
  return '<p class="muted">场景 <span class="pill">' + esc(plan.scenario) + '</span>'
       + '算法 <span class="pill">' + esc(plan.strategy) + '</span>'
       + (plan.city ? '城市 <span class="pill">' + esc(plan.city) + '</span>' : '')
       + '生成于 ' + esc(plan.generated_at) + '</p>';
}

/* 实时数据这一行：抓到了就报天气，没抓到就说清楚为什么 —— 不许假装知道天气 */
const COND = {clear:'晴', cloudy:'多云', rain:'雨', snow:'雪', storm:'雷雨'};
function realtimeNote(plan) {
  const rt = plan.realtime || {};
  const ws = rt.weather || [];
  if (ws.length) {
    const txt = ws.slice(0, 3).map(w =>
      w.date + ' ' + (COND[w.condition] || w.condition)
      + (w.temp_c == null ? '' : ' ' + Math.round(w.temp_c) + '℃')).join(' ｜ ');
    return '<p class="muted">🌤 实时天气：' + esc(txt)
         + '（抓取于 ' + esc((rt.fetched_at || '').replace('T', ' ')) + '）</p>';
  }
  const warn = rt.warnings || [];
  return '<p class="muted">🌤 未使用实时数据'
       + (warn.length ? '：' + esc(warn.join('；')) : '') + '</p>';
}

function warningsHtml(plan){
  if (plan.warnings && plan.warnings.length) {
    return '<div class="warn"><b>提示（' + plan.warnings.length + '）</b><br>'
         + plan.warnings.map(w => '· ' + esc(w)).join('<br>') + '</div>';
  }
  return '<div class="ok">无异常提示</div>';
}

/* 待核实清单：任务书明确要求"区分已核实信息与待确认信息"。
 * 后端一直在 meta.pending 里列，前端以前不渲染 —— 等于把这条要求做没了。 */
function pendingHtml(plan){
  const list = (plan.meta && plan.meta.pending) || [];
  if (!list.length) {
    return '<p class="muted">数据核对：本次用到的站点均带来源适用日期。</p>';
  }
  return '<div class="warn" style="background:#f8fafc;border-color:#e3e6ea;color:#475569">'
       + '<b>待核实（' + list.length + ' 项）</b>：下列站点的开放时间与价格取自种子数据，'
       + '未标注来源适用日期，出发前建议再确认一次。<br>'
       + list.map(x => '· ' + esc(x)).join('<br>') + '</div>';
}

function exportBar(){
  return '<div class="exp">'
    + '<button class="ghost" onclick="download(\'json\')">下载 JSON</button>'
    + '<button class="ghost" onclick="download(\'md\')">下载 Markdown</button>'
    + '<button class="ghost" onclick="download(\'csv\')">下载 CSV</button>'
    + '</div>';
}

/* 行程表：表格 + 原始 JSON */
function listHtml(plan){
  if (!plan.days || !plan.days.length) {
    return '<div class="card"><p class="muted">（空行程）</p></div>';
  }
  let html = '<div class="card">';
  plan.days.forEach(d => html += dayHtml(d));
  html += '<details><summary>查看原始 JSON（接口契约 ' + esc(plan.contract || 'v1') + '）</summary>'
        + '<pre>' + esc(JSON.stringify(plan, null, 2)) + '</pre></details>';
  return html + '</div>';
}

function dayHtml(d) {
  let s = '<div class="day"><h2>第 ' + d.day_index + ' 天'
        + (d.theme ? ' <span class="pill">' + esc(d.theme) + '</span>' : '')
        + ' <span class="muted">站点 ' + d.items.length + ' · 花费 '
        + d.total_cost.toFixed(2) + ' · 停留 ' + d.total_stay_min + ' 分钟 · 在途 '
        + d.total_travel_min.toFixed(1) + ' 分钟 · ' + d.total_distance_km.toFixed(2)
        + ' km</span></h2>';
  if (!d.items.length) return s + '<p class="muted">（空行程）</p></div>';
  s += '<table><thead><tr><th>#</th><th>时间</th><th>站点 / 解说</th><th>停留</th>'
     + '<th>花费</th><th>交通</th><th>理由</th></tr></thead><tbody>';
  d.items.forEach(it => {
    s += '<tr><td>' + it.seq + '</td><td>' + esc(it.arrive) + '–' + esc(it.leave) + '</td>'
       + '<td><b>' + esc(it.name) + '</b>'
       + (it.tips ? '<div class="tip">' + esc(it.tips) + '</div>' : '')
       + '</td><td>' + it.stay_min + ' 分</td>'
       + '<td>' + it.cost.toFixed(0) + '</td>'
       + '<td>' + (it.transport.mode === 'start' ? '起点'
                   : esc(it.transport.mode) + ' ' + it.transport.minutes.toFixed(0) + ' 分 / '
                     + it.transport.distance_km.toFixed(2) + ' km') + '</td>'
       + '<td class="muted">' + esc(it.reason) + '</td></tr>';
  });
  return s + '</tbody></table></div>';
}

/* ---------------------------------------------------------------- 时间轴 */

function toMin(hhmm){
  const p = String(hhmm || '00:00').split(':');
  return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
}
function hhmm(min){
  const m = Math.max(0, Math.round(min));
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}

function timelineHtml(plan){
  const days = (plan && plan.days) || [];
  if (!days.length) return '<div class="card"><p class="muted">（空行程）</p></div>';
  let html = '<div class="card"><div class="legend">'
           + '<span><i style="background:var(--stay)"></i>停留</span>'
           + '<span><i style="background:var(--move)"></i>在途</span>'
           + '<span><i style="background:var(--wait)"></i>等开门</span>'
           + '<span>横轴按真实时刻排布，空白 = 空闲</span></div>';
  days.forEach(d => html += dayTimeline(d, plan));
  return html + '</div>';
}

function dayTimeline(d, plan){
  const items = d.items || [];
  let s = '<div class="tl-day"><h3>第 ' + d.day_index + ' 天'
        + '<span>停留 ' + d.total_stay_min + ' 分 · 在途 ' + d.total_travel_min.toFixed(0)
        + ' 分 · 花费 ' + d.total_cost.toFixed(0) + '</span></h3>';
  if (!items.length) return s + '<p class="muted">（空行程，画不出时间轴）</p></div>';

  /* 三段拆开算，否则会把"到早了等开门"画成"在路上走了很久"：
   *   离开上一站 depart → 路上 travelEnd（depart + 在途）→ 等开门 wait（到开门时刻）
   * 引擎里 arrive = max(路上到的时间, open_time)，所以 arrive 不一定是车到站的时刻。
   */
  const startClock = toMin((plan && plan.request && plan.request.start_time) || '00:00');
  const segs = [];
  let prevLeave = null;
  items.forEach(it => {
    const arr = toMin(it.arrive), lv = toMin(it.leave);
    const t = it.transport || {};
    const travel = (t.mode && t.mode !== 'start') ? (t.minutes || 0) : 0;
    const depart = (prevLeave == null) ? startClock : prevLeave;
    const travelEnd = Math.min(depart + travel, arr);        // 路上到站时刻，不越过 arrive
    segs.push({it, arr, lv, travel, depart, travelEnd, wait: Math.max(0, arr - travelEnd)});
    prevLeave = lv;
  });

  // 时间范围：从第一段的"出发时刻"到最后一段的"离开时刻"，向外取整到整点
  let lo = Infinity, hi = -Infinity;
  segs.forEach(g => { lo = Math.min(lo, g.depart); hi = Math.max(hi, g.lv); });
  if (!isFinite(lo) || !isFinite(hi) || hi <= lo) { lo = toMin('08:00'); hi = lo + 60; }
  lo = Math.floor(lo / 60) * 60;
  hi = Math.ceil(hi / 60) * 60;
  if (hi - lo < 60) hi = lo + 60;

  const W = 900, BAR_H = 30, TOP = 14, AXIS = 26, H = TOP + BAR_H + AXIS + 6;
  // 左右留 10px：否则 07:00 / 14:00 这种首尾刻度的文字会被 viewBox 裁掉一半
  const PADL = 10, PADR = 10;
  const x = m => PADL + (m - lo) / (hi - lo) * (W - PADL - PADR);

  s += '<svg viewBox="0 0 ' + W + ' ' + H + '">';

  // 整点刻度：竖线 + 底部标签（首尾改对齐方式，避免出框）
  for (let m = lo; m <= hi; m += 60) {
    const px = x(m);
    const anchor = (m === lo) ? 'start' : (m === hi ? 'end' : 'middle');
    s += '<line x1="' + px.toFixed(1) + '" y1="' + TOP + '" x2="' + px.toFixed(1)
       + '" y2="' + (TOP + BAR_H) + '" stroke="#eef1f5" stroke-width="1"/>';
    s += '<text x="' + px.toFixed(1) + '" y="' + (TOP + BAR_H + 16)
       + '" fill="#6b7280" font-size="10" text-anchor="' + anchor + '">' + hhmm(m) + '</text>';
  }

  segs.forEach(g => {
    const it = g.it, t = it.transport || {};

    if (g.travel > 0.5) {                     // 在途段：从上一站离开算起
      const a = x(g.depart), b = x(g.travelEnd);
      s += '<rect x="' + a.toFixed(1) + '" y="' + (TOP + 4) + '" width="' + Math.max(b - a, 0.8).toFixed(1)
         + '" height="' + (BAR_H - 8) + '" rx="3" fill="#9aa4b2" fill-opacity="0.85">'
         + '<title>' + esc(it.name) + ' 前在途 ' + g.travel.toFixed(0) + ' 分钟 / '
         + (t.distance_km || 0).toFixed(2) + ' km</title></rect>';
    }

    if (g.wait > 0.5) {                       // 等开门：到站了但还没开门
      const a = x(g.travelEnd), b = x(g.arr);
      s += '<rect x="' + a.toFixed(1) + '" y="' + (TOP + 7) + '" width="' + Math.max(b - a, 0.8).toFixed(1)
         + '" height="' + (BAR_H - 14) + '" rx="2" fill="#f59e0b" fill-opacity="0.9">'
         + '<title>' + esc(it.name) + ' 等开门 ' + g.wait.toFixed(0) + ' 分钟</title></rect>';
    }

    const a = x(g.arr), b = x(g.lv);
    s += '<rect x="' + a.toFixed(1) + '" y="' + TOP + '" width="' + Math.max(b - a, 1.2).toFixed(1)
       + '" height="' + BAR_H + '" rx="4" fill="#2563eb">'
       + '<title>' + esc(it.name) + ' ' + esc(it.arrive) + '–' + esc(it.leave)
       + (g.wait > 0.5 ? '（含等开门 ' + g.wait.toFixed(0) + ' 分钟）' : '')
       + '（停留 ' + it.stay_min + ' 分钟）</title></rect>';

    // 段够宽才写字，否则只留 tooltip —— 挤在一起反而看不清
    if (b - a > 64) {
      s += '<text x="' + ((a + b) / 2).toFixed(1) + '" y="' + (TOP + BAR_H / 2 + 4)
         + '" fill="#fff" font-size="11" text-anchor="middle">'
         + esc(it.seq + '. ' + it.name) + '</text>';
    } else {
      s += '<text x="' + ((a + b) / 2).toFixed(1) + '" y="' + (TOP - 3)
         + '" fill="#1f2328" font-size="10" text-anchor="middle">' + it.seq + '</text>';
    }
  });

  s += '</svg></div>';
  return s;
}

/* ---------------------------------------------------------------- 地图 */

const DAY_COLORS = ['#2563eb', '#0d9488', '#c2410c', '#7c3aed', '#db2777', '#0369a1'];

/* 两个文本框是否相交（用于站名避让） */
function boxesHit(a, b) {
  return a.x1 < b.x2 && b.x1 < a.x2 && a.y1 < b.y2 && b.y1 < a.y2;
}

/* 内联 SVG：等距投影 + cos(lat) 修正 + 等比缩放（不拉伸形状），不发任何外部请求 */
function mapHtml(pts) {
  if (!pts || !pts.length) {
    return '<div class="card"><p class="muted">没有带坐标的站点，画不出地图。</p></div>';
  }
  if (pts.length === 1) {
    return '<div class="card"><p class="muted">只有 1 个站点，画不出路线。</p></div>';
  }

  const W = 900, H = 420, PAD = 44;
  const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
  let minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
  let minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
  if (maxLat - minLat < 1e-6) { minLat -= 0.002; maxLat += 0.002; }
  if (maxLon - minLon < 1e-6) { minLon -= 0.002; maxLon += 0.002; }

  // 经度方向按纬度余弦压缩，否则在中高纬度地图会横向变胖
  const kx = Math.cos(((minLat + maxLat) / 2) * Math.PI / 180);
  const spanX = (maxLon - minLon) * kx, spanY = (maxLat - minLat);
  const scale = Math.min((W - 2 * PAD) / Math.max(spanX, 1e-9),
                         (H - 2 * PAD) / Math.max(spanY, 1e-9));
  const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
  const X = lon => offX + (lon - minLon) * kx * scale;
  const Y = lat => H - offY - (lat - minLat) * scale;

  const days = [];
  pts.forEach(p => { if (days.indexOf(p.day) < 0) days.push(p.day); });
  days.sort((a, b) => a - b);
  const color = d => DAY_COLORS[(days.indexOf(d) < 0 ? 0 : days.indexOf(d)) % DAY_COLORS.length];

  let s = '<div class="card"><h2>路线图（离线绘制，不依赖地图瓦片）</h2>';
  s += '<div class="legend">';
  days.forEach(d => {
    s += '<span><i style="background:' + color(d) + '"></i>第 ' + d + ' 天</span>';
  });
  s += '</div>';
  s += '<svg viewBox="0 0 ' + W + ' ' + H + '">';

  days.forEach(d => {
    const one = pts.filter(p => p.day === d);
    if (one.length > 1) {
      s += '<polyline fill="none" stroke="' + color(d) + '" stroke-opacity="0.55" '
         + 'stroke-width="2" stroke-dasharray="6 5" points="'
         + one.map(p => X(p.lon).toFixed(1) + ',' + Y(p.lat).toFixed(1)).join(' ') + '"/>';
    }
  });

  // 站名不重叠：食堂/教学楼常常挤在几十米内，只试"上方/下方"两个位置不够，
  // 这里按「上→下→更上→更下→左上→右上→左下→右下」依次探，放到第一个不撞的位置。
  const labels = [];
  pts.forEach(p => {
    const x = X(p.lon), y = Y(p.lat), c = color(p.day);
    const half = Math.max(24, String(p.name).length * 6);
    const box = (xx, yy) => ({x1: xx - half, x2: xx + half, y1: yy - 11, y2: yy + 3});
    // 候选位置是**相对圆点的偏移**，不是绝对坐标 —— 写成绝对坐标会让所有标签落到 x=0。
    const cands = [
      [0, -18], [0, 26], [0, -34], [0, 42],
      [-(half + 6), -18], [half + 6, -18],
      [-(half + 6), 26], [half + 6, 26],
    ];
    let lx = x, ly = y - 18;
    for (const [dx, dy] of cands) {
      const cx = x + dx, cy = y + dy;
      if (cx - half < 2 || cx + half > W - 2) continue;          // 不许被 viewBox 裁掉
      if (cy < 10 || cy > H - 4) continue;
      if (!labels.some(b => boxesHit(b, box(cx, cy)))) { lx = cx; ly = cy; break; }
    }
    labels.push(box(lx, ly));

    s += '<g>';
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="13" fill="' + c
       + '" fill-opacity="0.18"/>';
    s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="10" fill="' + c + '">'
       + '<title>' + esc(p.name) + ' · 第 ' + p.day + ' 天 · ' + esc(p.arrive || '') + '</title></circle>';
    s += '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1)
       + '" fill="#fff" font-size="11" text-anchor="middle" pointer-events="none">' + p.seq + '</text>';
    s += '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1)
       + '" fill="#1f2328" font-size="11" text-anchor="middle" stroke="#fbfcfe" '
       + 'stroke-width="3" paint-order="stroke" pointer-events="none">'
       + esc(p.name) + '</text>';
    s += '</g>';
  });

  return s + '</svg><p class="muted" style="margin-top:8px">'
       + '等距投影 + 按纬度余弦压缩经度、等比缩放，只表示相对位置与先后顺序，不能当导航用。'
       + '悬停任意圆点可看站名与到达时刻。</p></div>';
}

/* ---------------------------------------------------------------- 算法对比 */

async function compare(){
  const payload = collect();
  LAST = payload;
  $('cmp').disabled = true;
  $('tabs').hidden = false;
  $('pane-compare').innerHTML = '<div class="card"><p class="muted">正在用同一份需求跑各算法…</p></div>';
  showTab('compare');
  let res;
  try {
    res = await api('/api/compare', payload);
  } catch (e) {
    $('pane-compare').innerHTML = '<div class="card"><div class="warn">请求失败：'
      + esc(e.message || e) + '</div></div>';
    $('cmp').disabled = false;
    return;
  }
  $('cmp').disabled = false;
  if (!res.ok) {
    $('pane-compare').innerHTML = '<div class="card"><div class="warn">' + esc(res.error) + '</div></div>';
    return;
  }
  CMP = res;
  $('pane-compare').innerHTML = compareHtml(CMP);
  if (!PLAN) $('summary').innerHTML = '<div class="card"><p class="muted">'
    + '还没生成行程 —— 先看「算法对比」，再点「生成行程」看具体路线。</p></div>';
}

function compareHtml(cmp){
  const rows = cmp.rows || [];
  if (!rows.length) return '<div class="card"><p class="muted">没有可对比的算法。</p></div>';

  let html = '<div class="card">';
  html += '<p class="cmp-summary">★ ' + esc(cmp.summary)
        + '（基线：' + esc(cmp.baseline || '无') + '）</p>';

  html += '<table><thead><tr>'
        + '<th>算法</th><th class="num">站点</th><th class="num">花费</th>'
        + '<th class="num">在途(分)</th><th class="num">距离(km)</th>'
        + '<th class="num">满意度</th><th class="num">预算</th><th class="num">时间</th>'
        + '<th class="num">路程</th><th class="num">可行性</th><th class="num">总分</th>'
        + '<th class="num">vs 基线</th></tr></thead><tbody>';

  rows.forEach(r => {
    const d = r.vs_baseline || {};
    const delta = (d.overall_pct == null) ? '—'
                : (d.overall_pct > 0 ? '+' : '') + d.overall_pct.toFixed(1) + '%';
    html += '<tr' + (r.is_best ? ' class="best"' : '') + '>'
         + '<td>' + (r.is_best ? '★ ' : '') + esc(r.strategy) + '</td>'
         + '<td class="num">' + r.items + '</td>'
         + '<td class="num">' + r.cost.toFixed(1) + '</td>'
         + '<td class="num">' + r.travel_min.toFixed(0) + '</td>'
         + '<td class="num">' + r.distance_km.toFixed(1) + '</td>'
         + '<td class="num">' + r.satisfaction.toFixed(2) + '</td>'
         + '<td class="num">' + r.cost_score.toFixed(2) + '</td>'
         + '<td class="num">' + r.time_score.toFixed(2) + '</td>'
         + '<td class="num">' + r.distance_score.toFixed(2) + '</td>'
         + '<td class="num">' + r.feasibility.toFixed(2) + '</td>'
         + '<td class="num"><b>' + r.overall.toFixed(4) + '</b></td>'
         + '<td class="num">' + delta + '</td></tr>';
  });
  html += '</tbody></table>';

  // 总分条形图：以最高分为满格，差异才看得见（都以 1.0 为满格时几乎是平条）
  const maxOverall = Math.max.apply(null, rows.map(r => r.overall)) || 1;
  html += '<div class="bars">';
  rows.forEach(r => {
    const w = Math.max(2, Math.round(r.overall / maxOverall * 100));
    html += '<div class="bar-row"><span>' + (r.is_best ? '★ ' : '') + esc(r.strategy) + '</span>'
         + '<div class="bar-track"><div class="bar-fill' + (r.is_best ? '' : ' dim')
         + '" style="width:' + w + '%"></div></div>'
         + '<span class="bar-val">' + r.overall.toFixed(4) + '</span></div>';
  });
  html += '</div>';

  html += '<p class="muted" style="margin-top:10px">'
        + '总分 = 四维加权 × 可行性，权重取自当前场景配置；'
        + '「vs 基线」是相对「' + esc(cmp.baseline || '—') + '」的总分变化。</p>';
  return html + '</div>';
}

/* ---------------------------------------------------------------- 导出 */

async function download(fmt) {
  if (!LAST) return;
  const res = await api('/api/export', Object.assign({}, LAST, {fmt: fmt}));
  if (!res.ok) { alert(res.error); return; }
  const blob = new Blob([res.content], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = res.filename;
  a.click();
}

/* ---------------------------------------------------------------- 局部调整 */

async function adjustPlan(){
  const text = $('adjText').value.trim();
  if (!text) { $('adjNote').textContent = '先写一句要改什么，例如「第2站太贵了换一个」。'; return; }
  if (!LAST) { $('adjNote').textContent = '先生成一份行程，再调整。'; return; }

  // 累加而不是替换：/api/adjust 每次都从"原始行程"重放，只发最后一句话会把前几次吞掉
  ADJ.push(text);
  $('adjGo').disabled = true;
  $('adjNote').textContent = '正在按「' + text + '」调整'
    + (ADJ.length > 1 ? '（连同前面 ' + (ADJ.length - 1) + ' 次一并在新行程上重放）' : '') + '…';
  let res;
  try {
    res = await api('/api/adjust', Object.assign({}, LAST, {instructions: ADJ.slice()}));
  } catch (e) {
    ADJ.pop();
    $('adjNote').textContent = '请求失败：' + (e.message || e);
    $('adjGo').disabled = false;
    return;
  }
  $('adjGo').disabled = false;
  if (!res.ok) { ADJ.pop(); $('adjNote').textContent = res.error; return; }

  PLAN = res.plan;
  PTS = res.map || [];
  renderPlan();
  showTab('list');
  const a = res.adjust || {};
  $('adjNote').textContent = a.changed_days
    ? ('已调整：' + (a.note || a.instruction)
       + '（第 ' + ADJ.length + ' 次，改了 ' + a.changed_days + ' 天的行程；前几次的结果已保留）')
    : ('没有改动：' + (a.note || '没听懂要改什么'));
  $('adjText').value = '';
}

$('go').onclick = plan;
$('cmp').onclick = compare;
$('adjGo').onclick = adjustPlan;
$('adjText').addEventListener('keydown', e => { if (e.key === 'Enter') adjustPlan(); });
$('reload').onclick = async () => { await api('/api/reload', {}); alert('已清空数据缓存'); };
bindScenarioStrategy();
boot();
</script>
