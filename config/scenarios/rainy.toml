# 场景：rainy —— 雨天（室内优先，少绕路）
#
# 用法：interests 预置"室内"，配合 engine/replan.py 的降雨重排；
# 户外点（tags 含"户外"）在重排时会被降权。

name = "rainy"
default_strategy = "stub"

day_start = "09:00"
day_end = "21:00"
daily_budget = 50.0
days = 1
max_poi_per_day = 5
default_pace = "normal"

[pace_factor]
relaxed = 0.6
normal = 1.0
packed = 1.4

[transport_speed_kmh]
walk = 4.0                 # 雨天走得更慢
bike = 10.0
bus = 16.0
metro = 28.0
car = 32.0

[transport_cost_per_km]
walk = 0.0
bike = 0.0
bus = 2.0
metro = 3.0
car = 0.6

default_mode = "walk"

# 雨天少走路：路程权重最高
[weights]
satisfaction = 0.35
cost = 0.20
time = 0.20
distance = 0.25

[weight_presets.save]
satisfaction = 0.30
cost = 0.45
time = 0.15
distance = 0.10

[weight_presets.fast]
satisfaction = 0.30
cost = 0.10
time = 0.40
distance = 0.20

[weight_presets.comfort]
satisfaction = 0.40
cost = 0.20
time = 0.20
distance = 0.20

[interest_alias]
"室内" = ["室内"]
"自习" = ["自习", "图书馆"]
"吃饭" = ["食堂", "餐饮"]
"买东西" = ["超市", "购物", "便利店"]
"运动" = ["运动", "健身", "游泳"]
"看电影" = ["电影", "商圈"]

[data_files]
pois = "pois.csv"
matrix = "travel_matrix.csv"
