# 场景：daily —— 日常出行基座场景（学生的一天：上课、自习、吃饭、办事）
#
# 这是"日常出行"的主场景。业务数值只准写在这里，Python 代码里不出现。
# 想看某一类情形怎么配，见 commute / errand / rainy / tight-budget 四个文件。

name = "daily"

# 默认算法策略（可选值见 engine/strategies.py 的 STRATEGIES）
# ⚠️ 必须写在任何 [table] 之前，否则会被 TOML 归进上面的表
default_strategy = "stub"

# ---- 时间窗：一天从早到晚，不是"旅游一天" ----
day_start = "07:00"
day_end = "22:00"

# ---- 预算：填 0 = 不限制；这里按学生一天的常规开销 ----
daily_budget = 60.0

# ---- 行程规模 ----
days = 1
max_poi_per_day = 8
# 没说"每天几站"时用几站。取 4 而不是上限 8：
# 上限是校验用的天花板，拿天花板当默认值等于"能塞多少塞多少"，
# 一天 8 站在日常出行里没人这么过，还把预算和时间切得很碎。
default_top_n = 4
default_pace = "normal"

# v1.6：只在"高德抓来的校区数据包"上启用语义归一化（见 strategies._needs_semantic）。
# 项目自己维护的 cities/dalian/pois.csv 标签本来就规范，行为逐字不变。
# 命中兴趣的点太少时补足到 10 个候选，避免换到哈工大只排 1 站。
# ⚠️ 顶层参数必须写在第一个 [table] 之前，否则会被 TOML 归进上一张表。
min_candidates = 10

# ---- 节奏 -> 每天站数系数 ----
[pace_factor]
relaxed = 0.6
normal = 1.0
packed = 1.4

# ---- 交通方式：速度（km/h）----
[transport_speed_kmh]
walk = 4.5
bike = 12.0
bus = 18.0
metro = 30.0
car = 35.0

# ---- 交通方式：每公里费用 ----
[transport_cost_per_km]
walk = 0.0
bike = 0.0
bus = 2.0
metro = 3.0
car = 0.6

# ---- 距离矩阵缺项时的估算方式 ----
default_mode = "walk"

# ---- 默认权重（各档位都没选时用它）----
[weights]
satisfaction = 0.45
cost = 0.25
time = 0.20
distance = 0.10

# ---- 三档权重：由 PlanRequest.profile 选（save / fast / comfort）----
[weight_presets.save]
satisfaction = 0.30
cost = 0.50
time = 0.15
distance = 0.05

[weight_presets.fast]
satisfaction = 0.30
cost = 0.15
time = 0.45
distance = 0.10

[weight_presets.comfort]
satisfaction = 0.45
cost = 0.20
time = 0.20
distance = 0.15

# ---- 兴趣词 -> POI 标签（左边是用户口语，右边必须是 tags 列里真实出现的词）----
[interest_alias]
"上课" = ["上课", "教室"]
"教学楼" = ["上课", "教室"]
"自习" = ["自习", "图书馆"]
"图书馆" = ["图书馆", "自习"]
"吃饭" = ["食堂", "餐饮"]
"早饭" = ["早餐", "食堂"]
"午饭" = ["食堂", "餐饮"]
"取快递" = ["快递"]
"快递" = ["快递"]
"打印" = ["打印", "复印"]
"超市" = ["超市", "购物"]
"买东西" = ["超市", "购物", "便利店"]
"运动" = ["运动", "跑步", "篮球"]
"看病" = ["医疗", "药店"]
"室内" = ["室内"]
"户外" = ["户外"]

# 语义标签归一化：{语义标签: [点位名称/分类里出现的关键词]}。
# 高德 POI 的 tags 是「科教文化服务|学校|高等院校」这类原始分类，
# 跟「图书馆」「吃饭」「拍照」对不上。只在 campuses/ 数据包上生效。
[tag_aliases]
"图书馆" = ["图书馆", "阅览"]
"自习" = ["图书馆", "自习", "阅览"]
"看书" = ["图书馆", "书店", "阅览"]
"食堂" = ["食堂", "餐厅", "快餐厅", "餐饮"]
"餐饮" = ["食堂", "餐厅", "餐饮", "咖啡", "快餐厅"]
"吃饭" = ["食堂", "餐厅", "餐饮"]
"早饭" = ["食堂", "早餐", "餐厅"]
"午饭" = ["食堂", "餐厅", "餐饮"]
"展馆" = ["博物馆", "纪念馆", "校史馆", "航天馆", "美术馆", "展览馆", "艺术博物馆"]
"打卡" = ["二校门", "校门", "大礼堂", "主楼", "清华园", "航天馆", "校史馆", "博物馆"]
"拍照" = ["二校门", "校门", "大礼堂", "主楼", "清华园", "水木清华", "荷塘", "情人坡", "风景名胜", "广场"]
"户外" = ["广场", "公园", "步道", "荷塘", "湖", "河畔", "草坪", "风景名胜", "园林"]
"散步" = ["步道", "河畔", "荷塘", "园林", "风景名胜"]
"公园" = ["公园", "园林", "荷塘", "清华园", "近春园"]
"广场" = ["广场"]
"自然" = ["荷塘", "湖", "河畔", "园林", "树林", "风景名胜"]
"运动" = ["体育馆", "体育场", "操场", "运动场所", "篮球", "田径", "游泳", "健身"]
"跑步" = ["操场", "田径", "运动场所"]
"篮球" = ["篮球", "体育馆", "运动场所"]
"室内" = ["图书馆", "博物馆", "航天馆", "大礼堂", "教学楼"]
"医疗" = ["医院", "校医院", "医务室", "药店"]
"快递" = ["快递", "驿站", "菜鸟"]
"超市" = ["超市", "便利店", "商店"]

# 语义大类：按大类限量，挡住「中餐厅 / 快餐厅 / 星巴克咖啡」被当成 3 类、
# 结果一天 4 站都在吃饭。只在 campuses/ 数据包上生效。
[candidate_groups]
"餐饮" = ["餐厅", "食堂", "咖啡", "餐饮", "快餐厅", "星巴克"]
"图书馆" = ["图书馆", "阅览"]
"展馆" = ["博物馆", "纪念馆", "校史馆", "航天馆", "美术馆", "科教文化场所", "展览"]
"运动" = ["体育", "操场", "运动场所", "健身"]
"景观" = ["风景名胜", "公园", "广场", "园林", "步道", "荷塘", "水木清华"]
"教学" = ["高等院校", "学校", "教学楼", "科研机构", "学院", "研究所"]
"居住" = ["住宅", "公寓", "宿舍"]
"交通" = ["停车场", "出入口", "地铁站", "公交站", "出口", "入口"]
"服务" = ["快递", "银行", "ATM", "超市", "商店", "便利店", "卫生间", "自助"]

[candidate_exclude]
groups = ["居住", "交通", "服务"]
name_keywords = ["停车场", "车辆出口", "出入口", "自助还书", "ATM", "卫生间",
                 "快递", "公寓", "地铁站", "还书", "银行", "变电", "锅炉"]

# ---- 数据文件（相对 data/ 目录）----
[data_files]
pois = "pois.csv"
matrix = "travel_matrix.csv"
