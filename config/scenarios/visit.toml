# 场景：visit —— 校外访客/外校学生来校参观（"可执行"优先于"最优"）
#
# 与 daily 的根本区别：
#   daily  = 校内学生的一天，目标是"优化"（少绕路、时间利用率高）
#   visit  = 外来者的半天，目标是"可执行"（几点到哪个门、要不要预约、每站看什么、赶不上怎么办）
# 所以这个场景「时间窗窄、站数少、权重偏时间与体验」，并且必须配 visitor_guide.json 的入校须知。

name = "visit"
default_strategy = "greedy"

# 访客通常 9 点到、17 点前离校（校史馆 16:30 停止入场）
day_start = "09:00"
day_end = "17:00"

daily_budget = 80.0

days = 1
max_poi_per_day = 6
default_top_n = 5
default_pace = "normal"

# ---- v1.6 访客详细行程：候选池与停留节奏 ----
# ⚠️ 顶层参数必须写在第一个 [table] 之前，否则会被 TOML 归进上一张表。
# 命中太少时按质量分 + 类别多样性补足到 10 个候选，避免只排 1 站或全是图书馆。
min_candidates = 10
# 访客停留的兜底上限（分钟）：高德默认 60/120 分钟是"进去自习/参观"的口径，
# 访客只看外观、还要留时间办入校手续，按下面 visit_stay_cap 压缩。
visit_stay_default = 45

[pace_factor]
relaxed = 0.7
normal = 1.0
packed = 1.2

[transport_speed_kmh]
walk = 4.2
bike = 11.0
bus = 18.0
metro = 30.0
car = 30.0

[transport_cost_per_km]
walk = 0.0
bike = 0.0
bus = 2.0
metro = 3.0
car = 0.6

default_mode = "walk"

# 访客更在意"看得值、别浪费时间"，对省钱没那么敏感（但预算仍要守）
[weights]
satisfaction = 0.45
cost = 0.15
time = 0.30
distance = 0.10

[weight_presets.save]
satisfaction = 0.30
cost = 0.45
time = 0.20
distance = 0.05

[weight_presets.fast]
satisfaction = 0.35
cost = 0.10
time = 0.45
distance = 0.10

[weight_presets.comfort]
satisfaction = 0.50
cost = 0.15
time = 0.20
distance = 0.15

# 访客的口语与校内学生不同：「拍照」「看看」「逛」都要能落到点上
[interest_alias]
"看看" = ["户外", "散步", "公园"]
"逛逛" = ["户外", "散步", "广场"]
"拍照" = ["海景", "户外", "广场", "公园"]
"打卡" = ["户外", "广场", "公园", "展馆"]
"图书馆" = ["图书馆", "自习"]
"看书" = ["图书馆", "自习"]
"运动" = ["运动", "跑步", "篮球"]
"吃饭" = ["食堂", "餐饮"]
"午饭" = ["食堂", "餐饮"]
"散步" = ["散步", "公园", "户外"]
"湖" = ["户外", "散步", "自然"]
"展馆" = ["展馆"]
"室内" = ["室内"]
"户外" = ["户外"]

# 语义标签归一化：{语义标签: [点位名称/分类里出现的关键词]}
# 只用于"匹配"，不改写 CSV；不配这张表的场景行为逐字不变。
[tag_aliases]
"图书馆" = ["图书馆", "阅览"]
"自习" = ["图书馆", "自习", "阅览"]
"看书" = ["图书馆", "书店", "阅览"]
"食堂" = ["食堂", "餐厅", "快餐厅", "餐饮"]
"餐饮" = ["食堂", "餐厅", "餐饮", "咖啡", "快餐厅"]
"吃饭" = ["食堂", "餐厅", "餐饮"]
"午饭" = ["食堂", "餐厅", "餐饮"]
"展馆" = ["博物馆", "纪念馆", "校史馆", "航天馆", "美术馆", "展览馆", "艺术博物馆"]
"打卡" = ["二校门", "校门", "大礼堂", "主楼", "清华园", "航天馆", "校史馆", "博物馆"]
"拍照" = ["二校门", "校门", "大礼堂", "主楼", "清华园", "水木清华", "荷塘", "情人坡", "风景名胜", "广场"]
"户外" = ["广场", "公园", "步道", "荷塘", "湖", "河畔", "草坪", "风景名胜", "园林"]
"散步" = ["步道", "河畔", "荷塘", "园林", "风景名胜"]
"公园" = ["公园", "园林", "荷塘", "清华园", "近春园"]
"广场" = ["广场"]
"海景" = ["海滨", "海景", "星海", "海边"]
"自然" = ["荷塘", "湖", "河畔", "园林", "树林", "风景名胜"]
"运动" = ["体育馆", "体育场", "操场", "运动场所", "篮球", "田径", "游泳", "健身"]
"跑步" = ["操场", "田径", "运动场所"]
"篮球" = ["篮球", "体育馆", "运动场所"]
"室内" = ["图书馆", "博物馆", "航天馆", "大礼堂", "教学楼"]

# 按分类压停留上限（分钟）。访客不进馆自习、不进场馆运动，
# 看外观 + 拍照 + 听一句讲解就该走了；省下的时间用来多串几个点。
[visit_stay_cap]
"图书馆" = 20
"博物馆" = 60
"科教文化场所" = 45
"风景名胜" = 30
"运动场所" = 20
"综合体育馆" = 15
"中餐厅" = 40
"快餐厅" = 30
"高等院校" = 20
"学校" = 20
"住宅小区" = 10

# 语义大类：高德把「中餐厅 / 快餐厅 / 星巴克咖啡」当成 3 个不同的 category，
# 只按 category 限量挡不住"4 站都在吃饭"。按大类归组后每组最多留 3 个。
[candidate_groups]
"餐饮" = ["餐厅", "食堂", "咖啡", "餐饮", "快餐厅", "星巴克"]
"图书馆" = ["图书馆", "阅览"]
"展馆" = ["博物馆", "纪念馆", "校史馆", "航天馆", "美术馆", "科教文化场所", "展览"]
"运动" = ["体育", "操场", "运动场所", "健身"]
"景观" = ["风景名胜", "公园", "广场", "园林", "步道", "荷塘", "水木清华"]
"教学" = ["高等院校", "学校", "教学楼", "科研机构", "学院", "研究所"]
"居住" = ["住宅", "公寓", "宿舍"]
"交通" = ["停车场", "出入口", "地铁站", "公交站", "出口", "入口"]
"服务" = ["快递", "银行", "ATM", "超市", "商店", "便利店", "卫生间", "自助"]

# 这些不是"参观的一站"：宿舍、停车场出口、自助还书机……
[candidate_exclude]
groups = ["居住", "交通", "服务"]
name_keywords = ["停车场", "车辆出口", "出入口", "自助还书", "ATM", "卫生间",
                 "快递", "公寓", "地铁站", "还书", "银行", "变电", "锅炉"]

[data_files]
# v1.6：**不再写死某一所高校的点位表**。
# 访客只在校区内活动，具体读哪份表由高校注册表的 visit_poi 决定
# （dalian → cities/dalian/pois_campus.csv；hit/tsinghua → 各自的校区包）。
# 下面这两个路径只作"未注册城市 / 老调用"的兜底，新增高校时一个字都不用改。
pois = "cities/dalian/pois_campus.csv"
matrix = "cities/dalian/travel_matrix.csv"
poi_routing = "campus_visit"
