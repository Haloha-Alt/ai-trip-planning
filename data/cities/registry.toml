# 城市注册表 —— 城市是"数据路由"，不是代码分支。
#
# 设计原则（务必遵守）：
#   1. 新增一个城市 = 在 data/cities/<key>/ 放一份 pois.csv，然后在这里加一段 [cities.<key>]。
#      **engine/ 与 ui/ 里不许出现任何城市名**，改城市相关的东西只动这里和 data/cities.py。
#   2. poi / matrix 是相对 data/ 目录的路径。文件不存在时自动回退到场景配置里的默认数据。
#   3. aliases 用于把用户输入（"大连市"、"dalian"、"我想去大连"）解析到 key。
#
# 坐标是城市中心点，用于：地图初始视野、bbox 过滤、未知城市时的兜底。

default = "dalian"

# kind = "campus" 表示这份数据包是**一所高校**（UI 下拉框只列这些）。
# label 是 UI 显示名；没写 label 用 name。
# visit_poi = 访客场景（visit）专用的**校内点位表**；没写就直接用 poi。
#   之所以单独留一个字段：dalian 的 poi 是"城市全量"（混着星海广场等校外商圈），
#   而访客只在校区里活动，必须读裁剪过的 pois_campus.csv；其余高校的包本身就
#   全是校内点，poi 即访客口径，无需再写一份。
[cities.dalian]
name = "大连"
label = "大连理工大学"
kind = "campus"
aliases = ["大连市", "dalian", "dl", "大连理工大学", "大工"]
lat = 38.9140
lon = 121.6147
poi = "cities/dalian/pois.csv"
visit_poi = "cities/dalian/pois_campus.csv"
matrix = "cities/dalian/travel_matrix.csv"

[cities.beijing]
name = "北京"
aliases = ["北京市", "beijing", "bj", "peking"]
lat = 39.9042
lon = 116.4074
poi = "cities/beijing/pois.csv"
matrix = "cities/beijing/travel_matrix.csv"

